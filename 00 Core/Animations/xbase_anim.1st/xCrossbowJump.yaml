# Blending into xCrossbowJump only.
#
# Per-animation rules are appended AFTER the global ruleset and the bottom-most
# matching rule wins, so both rules here outrank animations/animation-config.yaml.

blending_rules:
  # Anything -> this jump. Covers idle->jump and movement->jump alike, since the
  # global config has no jump-entry rule and they were falling through to the
  # generic one. Same long lead-in as the spear (x2wJump).
  - from: "*"
    to: "jump*"
    easing: "cubicOut"
    duration: 1.2

  # Landing. Every jump replay goes through clear-then-play, so the "previous"
  # state here is the idle/movement underneath, not the jump - "$" never matches.
  - from: "*"
    to: "jump*:loop stop"
    easing: "sineOut"
    duration: 0.15
